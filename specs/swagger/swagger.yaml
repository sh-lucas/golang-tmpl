basePath: /
definitions:
  admins.credentials:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  health.Database:
    properties:
      size_bytes:
        type: integer
    type: object
  health.PSI:
    properties:
      cpu_avg10_percent:
        type: number
      io_avg10_percent:
        type: number
      memory_avg10_percent:
        type: number
    type: object
  health.Process:
    properties:
      cpu_usage_percent:
        type: number
      heap_bytes:
        type: integer
      memory_rss_bytes:
        type: integer
    type: object
  health.Response:
    properties:
      database:
        $ref: '#/definitions/health.Database'
      google_latency_ms:
        type: number
      goroutines:
        type: integer
      process:
        $ref: '#/definitions/health.Process'
      psi:
        $ref: '#/definitions/health.PSI'
      status:
        type: string
    type: object
  libsql.restoreResponse:
    properties:
      backup:
        description: Backup is the pre-restore copy of the replaced database, relative
          to DATABASE_ROOT.
        example: backups/pre-restore-20260101T000000.000Z.db
        type: string
    type: object
  queries.CreateAdminRow:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
    type: object
  queries.GetAdminBySessionRow:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
    type: object
info:
  contact: {}
  description: Minimal Go 1.27 API using net/http, JSON v2, SQLite and sqlc.
  title: Go HTTP template API
  version: "1.0"
paths:
  /admins:
    post:
      consumes:
      - application/json
      description: The first admin is public bootstrap; subsequent admins require
        authentication.
      parameters:
      - description: Admin credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/admins.credentials'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/queries.CreateAdminRow'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Create an admin
      tags:
      - admins
  /admins/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/queries.GetAdminBySessionRow'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get the authenticated admin
      tags:
      - admins
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/admins.credentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Authenticate an admin
      tags:
      - auth
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/health.Response'
      summary: Get application health and process metrics
      tags:
      - health
  /libsql:
    post:
      consumes:
      - application/json
      description: Connect using a Bearer token configured in DATABASE_ACCESS_KEY.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Execute SQL through libSQL HTTP
      tags:
      - libsql
  /libsql/snapshot:
    get:
      description: Streams a self-contained copy of sqlite.db (VACUUM INTO). large_blobs/
        is not included.
      produces:
      - application/vnd.sqlite3
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Download a consistent database snapshot
      tags:
      - libsql
    put:
      consumes:
      - application/vnd.sqlite3
      description: Validates the upload (integrity, foreign keys, known migrations),
        applies pending migrations to it, saves the current database under backups/
        and restores the upload atomically. large_blobs/ is not touched.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libsql.restoreResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Replace the database with an uploaded snapshot
      tags:
      - libsql
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
