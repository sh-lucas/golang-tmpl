name: Tests

on:
  pull_request:
    branches-ignore: [main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run Go tests
        run: go test ./...
