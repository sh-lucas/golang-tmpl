name: Container

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Podman build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install --yes podman
      - name: Build minimal image
        run: podman build --build-arg CGO_ENABLED="$CGO_ENABLED" --tag golang-tmpl:${{ github.sha }} .
      - name: Inspect image
        run: podman image inspect golang-tmpl:${{ github.sha }}
