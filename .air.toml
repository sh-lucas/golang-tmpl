root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "sqlc generate && go build -buildvcs=false -o ./tmp/main ./cmd/backend"
  delay = 1000
  # Exact paths from the root (Air does not match directory basenames).
  exclude_dir = ["data", "tmp", "vendor", "testdata", "specs/book", "specs/docs"]
  exclude_file = []
  # Generated files: the build itself (sqlc) or just check writes them, so watching them loops.
  exclude_regex = ["_test\\.go$", "/internal/queries/", "database/schema\\.sql$", "specs/swagger/swagger\\.yaml$"]
  # sqlc, swag and gofmt rewrite files with identical content.
  exclude_unchanged = true
  follow_symlink = false
  full_bin = "./tmp/main"
  include_dir = []
  include_ext = ["go", "sql", "yaml"]
  include_file = []
  # Above the app shutdown budget (8s), so Air never SIGKILLs a clean shutdown.
  kill_delay = "10s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
